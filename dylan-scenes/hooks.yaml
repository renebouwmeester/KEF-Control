# Cinema hooks in your Dylan format. Two ways to wire them:
#
#  A) Direct (recommended) — the hook runs the shell script below, which does the
#     pyatv wake + KEF source-switch + verify-retry volume in one place.
#
#  B) Uniform with "Baroque KEF Roon" — wrap each script in a Shortcut whose only
#     action is "Run Shell Script: <path>/cinema-on.sh", then point the hook at
#     /usr/bin/shortcuts like your other hooks. Extra layer, no extra function.
#
# Below is option A. Merge these two entries into your existing hooks file.
# Auth is omitted to match your other hooks; the commented trigger-rule adds a
# shared-secret header if you want it (also set the same header in Baton).

- id: cinema-on
  execute-command: "/Users/rene/Documents/Apps/kef-control-menubar/dylan-scenes/cinema-on.sh"
  command-working-directory: "/Users/rene/Documents/Apps/kef-control-menubar/dylan-scenes"
  response-message: "cinema-on"
  # trigger-rule:
  #   match:
  #     type: value
  #     value: "REPLACE_WITH_A_SHARED_SECRET"
  #     parameter:
  #       source: header
  #       name: X-Baton-Token

- id: cinema-off
  execute-command: "/Users/rene/Documents/Apps/kef-control-menubar/dylan-scenes/cinema-off.sh"
  command-working-directory: "/Users/rene/Documents/Apps/kef-control-menubar/dylan-scenes"
  response-message: "cinema-off"
